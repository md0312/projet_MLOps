# Intégration continue : à chaque push et à chaque Pull Request vers main,
# GitHub installe le projet sur une machine neuve, vérifie la qualité du code
# et lance les tests.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Qualité du code et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances et le package
        run: pip install -r requirements.txt

      - name: Vérifier le style et la qualité du code
        run: make lint

      - name: Lancer les tests et mesurer la couverture
        run: make coverage
