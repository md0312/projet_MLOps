version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "{asctime} - {name} - {levelname} - {message}"
    datefmt: "%Y-%m-%d %H:%M:%S"
    style: "{"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [console]
