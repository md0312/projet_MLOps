# Configuration candidate : SVM à noyau RBF calibré (comparé au modèle final).
# Usage : python -m bank_marketing.application.train --config configs/svm.yaml

random_state: 42

data:
  test_size: 0.2

features:
  feature_set: complete

cross_validation:
  n_splits: 5

model:
  name: svm
  params:
    kernel: rbf
    C: 1.0
    gamma: scale
    class_weight: balanced

threshold:
  strategy: f1
