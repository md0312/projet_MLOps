# Configuration candidate : forêt aléatoire (comparée au modèle final).
# Usage : python -m bank_marketing.application.train --config configs/random_forest.yaml

random_state: 42

data:
  test_size: 0.2

features:
  feature_set: complete

cross_validation:
  n_splits: 5

model:
  name: random_forest
  params:                   # Réglage retenu par Optuna (PR-AUC en validation croisée)
    n_estimators: 500
    max_depth: 3
    min_samples_leaf: 8
    max_features: 0.5954139606062722
    class_weight: balanced
    n_jobs: -1

threshold:
  strategy: f1
